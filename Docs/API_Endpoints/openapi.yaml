      summary: Register Tickets which were sold
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketRequest"
        required: true
      responses:
        "201":
          description: Tickets created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketResponse"
        "400":
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ticket Endpoint Impl
      security:
      - SecurityScheme:
        - ADMIN
info:
  title: App API
  version: 0.1.0-SNAPSHOT
