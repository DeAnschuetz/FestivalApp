quarkus.datasource."main".db-kind=postgresql 
quarkus.datasource."main".username=postgres
quarkus.datasource."main".password=admin123
quarkus.datasource."main".jdbc.url=jdbc:postgresql://localhost:5432/postgres

quarkus.http.limits.max-body-size=50M
quarkus.http.body.handle-file-uploads=true

quarkus.index-dependency.model.group-id=com.ffb
quarkus.index-dependency.model.artifact-id=model
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.packages=com.ffb.model.db.object
quarkus.hibernate-orm.datasource=main

quarkus.hibernate-orm."virtual".database.generation=none
quarkus.hibernate-orm."virtual".packages=com.ffb.model.db.view
quarkus.hibernate-orm."virtual".datasource=main

quarkus.log.level=INFO
quarkus.log.category."com.ffb".level=INFO

foodcourt.preparation.speed=5
foodcourt.preparation.time=600
foodcourt.simmulation.speed=300
account.initial.credit=1000
order.extra.price=2.0

# Verify incoming JWTs
mp.jwt.verify.publickey.location=classpath:publicKey.pem
mp.jwt.verify.issuer=https://your-app.example

# Sign JWTs you create in /auth/login
smallrye.jwt.sign.key.location=classpath:privateKey.pem

# Read JWT from a cookie
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token

# Optional: also accept Authorization header if someone uses it (useful for Postman)
smallrye.jwt.always-check-authorization=true

quarkus.swagger-ui.with-credentials=true